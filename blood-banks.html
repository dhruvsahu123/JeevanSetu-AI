<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JeevanSetu AI | Blood Bank Intelligence & Match</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #070D18; color: #F8FAFC; font-family: system-ui, sans-serif; margin: 0; padding: 25px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1E293B; padding-bottom: 15px; margin-bottom: 25px; }
    .scanner-box { background: #0D1626; border: 1px solid #1E293B; border-radius: 10px; padding: 20px; margin-bottom: 25px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)) auto; gap: 15px; align-items: end; }
    select, input { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #0F172A; color: #FFF; }
    .btn-red { background: #EF4444; color: white; border: none; padding: 13px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-red:hover { background: #DC2626; }
    table { width: 100%; border-collapse: collapse; background: #0D1626; border-radius: 10px; overflow: hidden; margin-top: 15px; }
    th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #1E293B; font-size: 14px; }
    th { background: #0F1D33; color: #94A3B8; text-transform: uppercase; font-size: 12px; }
    .badge-demo { padding: 3px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; background: rgba(245, 158, 11, 0.2); color: #F59E0B; border: 1px solid #F59E0B; margin-left: 6px; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1 style="margin:0; font-size:24px;">🩸 Blood Bank Intelligence & Rare Phenotype Match</h1>
      <p style="margin:5px 0 0 0; color:#94A3B8;">Kanpur Regional Trauma Grid & Component Engine <span class="badge-demo">SYNTHETIC DEMO DATA</span></p>
    </div>
    <a href="/index.html" style="color:#38BDF8; text-decoration:none; font-weight:600;">&larr; Back to Home</a>
  </div>

  <div class="scanner-box">
    <h3 style="margin:0 0 12px 0; color:#F87171;">🧬 PATIENT COMPATIBILITY SCANNER</h3>
    <div class="form-grid">
      <div>
        <label style="font-size:12px; color:#94A3B8;">RECIPIENT BLOOD GROUP</label>
        <select id="recGrp">
          <option value="O-">O Negative (Universal RBC Donor)</option>
          <option value="O+">O Positive</option>
          <option value="A+">A Positive</option>
          <option value="B+">B Positive</option>
          <option value="AB+">AB Positive (Universal Plasma)</option>
        </select>
      </div>
      <div>
        <label style="font-size:12px; color:#94A3B8;">COMPONENT NEEDED</label>
        <select>
          <option>Packed Red Blood Cells (PRBC)</option>
          <option>Single Donor Platelets (SDP)</option>
          <option>Fresh Frozen Plasma (FFP)</option>
        </select>
      </div>
      <div>
        <label style="font-size:12px; color:#94A3B8;">UNITS REQUIRED</label>
        <input type="number" value="2" min="1">
      </div>
      <button class="btn-red" onclick="scanGrid()">SCAN KANPUR GRID</button>
    </div>
  </div>

  <input type="text" id="bbSearch" placeholder="🔍 Search blood bank facility or locality..." style="width:100%; padding:12px; border-radius:6px; border:1px solid #334155; background:#0F172A; color:#FFF; margin-bottom:15px;" oninput="fetchBloodBanks()">

  <table>
    <thead>
      <tr>
        <th>Blood Bank Facility</th>
        <th>Zone / Locality</th>
        <th>O- (Universal Reserve)</th>
        <th>Platelets (SDP Units)</th>
        <th>Emergency Contact</th>
      </tr>
    </thead>
    <tbody id="bbBody">
      <tr><td colspan="5" style="text-align:center; padding:20px; color:#94A3B8;">Loading blood bank network...</td></tr>
    </tbody>
  </table>

  <script>
    function fetchBloodBanks() {
      var q = document.getElementById('bbSearch').value;
      fetch('/api/v2/bloodbanks?q=' + encodeURIComponent(q))
        .then(function(r){ return r.json(); })
        .then(function(res){
          if(res.status === 'success') {
            renderBB(res.data);
          }
        }).catch(function(e){
          document.getElementById('bbBody').innerHTML = '<tr><td colspan="5" style="text-align:center; color:#EF4444;">Unable to load blood banks.</td></tr>';
        });
    }

    function renderBB(items) {
      var tbody = document.getElementById('bbBody');
      if(!items || items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px; color:#94A3B8;">No blood banks found.</td></tr>';
        return;
      }
      tbody.innerHTML = items.map(function(b){
        var badge = b.is_demo ? '<span class="badge-demo">DEMO</span>' : '';
        return '<tr>' +
          '<td><strong>' + b.name + '</strong>' + badge + '</td>' +
          '<td>' + b.area + '</td>' +
          '<td style="color:#EF4444; font-weight:bold;">' + b.o_neg + ' Units Free</td>' +
          '<td style="color:#10B981; font-weight:bold;">' + b.platelets + ' Units Free</td>' +
          '<td>' + b.contact + '</td>' +
        '</tr>';
      }).join('');
    }

    function scanGrid() {
      alert('Kanpur Trauma Grid Match: Multiple blood banks have matching reserve stock for immediate dispatch.');
    }

    fetchBloodBanks();
  </script>
</body>
</html>
