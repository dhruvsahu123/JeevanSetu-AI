<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JeevanSetu AI | Live Fleet Telemetry & Green Corridor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #07111F;
      --card: #0D1B2A;
      --border: #1E354F;
      --teal: #14B8A6;
      --sky: #38BDF8;
      --danger: #EF4444;
      --text: #F8FAFC;
      --muted: #94A3B8;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: var(--card); border-bottom: 1px solid var(--border); padding: 0.9rem 2rem; display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
    .brand { font-size: 1.15rem; font-weight: 800; display: flex; align-items: center; gap: 0.5rem; }
    .main-layout { display: flex; flex: 1; height: calc(100vh - 65px); }
    .sidebar { width: 380px; background: var(--card); border-right: 1px solid var(--border); padding: 1.25rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
    #map { flex: 1; height: 100%; background: #0b1523; }
    .fleet-card { background: #07111F; border: 1px solid var(--border); border-radius: 8px; padding: 1rem; cursor: pointer; transition: 0.2s; }
    .fleet-card:hover { border-color: var(--sky); }
    .fleet-card.active { border-color: var(--teal); background: #0e2238; }
    .status-badge { font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: 700; }
    .status-available { background: rgba(20, 184, 166, 0.2); color: var(--teal); }
    .status-busy { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .corridor-banner { background: rgba(56, 189, 248, 0.1); border: 1px solid var(--sky); border-radius: 8px; padding: 0.85rem; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>🚑</span>
      <span>JEEVANSETU FLEET TELEMETRY</span>
    </div>
    <div style="display:flex; gap:1.25rem; align-items:center;">
      <span style="font-size:0.85rem; color:var(--muted);">Kanpur Metro & NH-19 Grid</span>
      <a href="../index.html" style="color:var(--sky); text-decoration:none; font-weight:700; font-size:0.9rem;">← Back to Home</a>
    </div>
  </header>

  <div class="main-layout">
    <div class="sidebar">
      <div class="corridor-banner">
        <strong>🟢 NH-19 Green Corridor Sync</strong>
        <p style="color:var(--muted); font-size:0.8rem; margin-top:0.25rem;">Active traffic signal preemption enabled for critical transit routes.</p>
      </div>

      <h3 style="font-size:1rem; font-weight:700; color:var(--muted);">ACTIVE UNITS (<span id="unitCount">0</span>)</h3>
      <div id="fleetList" style="display:flex; flex-direction:column; gap:0.75rem;"></div>
    </div>

    <div id="map"></div>
  </div>

  <script>
    const map = L.map('map').setView([26.4350, 80.3550], 12);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    }).addTo(map);

    let markers = {};

    // Kanpur Rooma to LLR Hospital Corridor Waypoints
    const corridorPath = [
      [26.3785, 80.4421], // SPM Hospital Rooma
      [26.4082, 80.3456], // Naubasta Bypass
      [26.4310, 80.3870], // Ramadevi Chauraha
      [26.4450, 80.3100], // Govind Nagar Flyover
      [26.4835, 80.3150]  // Hallet / LLR Hospital
    ];

    const corridorLine = L.polyline(corridorPath, {
      color: '#10B981',
      weight: 4,
      dashArray: '8, 8',
      opacity: 0.8
    }).addTo(map);

    async function loadAmbulances() {
      try {
        const res = await fetch('/api/ambulances');
        const data = await res.json();
        const ambulances = data.ambulances || [];

        document.getElementById('unitCount').textContent = ambulances.length;
        const list = document.getElementById('fleetList');
        list.innerHTML = '';

        ambulances.forEach((a, idx) => {
          // Render Sidebar Item
          const card = document.createElement('div');
          card.className = 'fleet-card' + (idx === 0 ? ' active' : '');
          card.innerHTML = 
            <div style="display:flex; justify-content:space-between; margin-bottom:0.4rem;">
              <strong style="color:#fff; font-family:'JetBrains Mono';"></strong>
              <span class="status-badge status-available"></span>
            </div>
            <div style="font-size:0.85rem; color:var(--muted);">Pilot: </div>
            <div style="font-size:0.8rem; color:var(--sky); margin-top:0.25rem;">📞 </div>
          ;
          card.onclick = () => focusVehicle(a.id, a.current_latitude, a.current_longitude);
          list.appendChild(card);

          // Render Marker on Map
          if (!markers[a.id]) {
            const m = L.circleMarker([a.current_latitude, a.current_longitude], {
              radius: 8,
              fillColor: '#38BDF8',
              color: '#ffffff',
              weight: 2,
              fillOpacity: 1
            }).addTo(map);

            m.bindPopup('<b>' + a.vehicle_number + '</b><br>Type: ' + a.fleet_type + '<br>Pilot: ' + a.driver_name);
            markers[a.id] = m;
          } else {
            markers[a.id].setLatLng([a.current_latitude, a.current_longitude]);
          }
        });
      } catch (e) {
        console.error(e);
      }
    }

    function focusVehicle(id, lat, lng) {
      map.flyTo([lat, lng], 14);
      if (markers[id]) markers[id].openPopup();
    }

    loadAmbulances();
  </script>
</body>
</html>
