<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JeevanSetu AI | Live Fleet Telemetry & Green Corridor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #07111F;
      --card: #0D1B2A;
      --border: #1E354F;
      --teal: #14B8A6;
      --sky: #38BDF8;
      --danger: #EF4444;
      --text: #F8FAFC;
      --muted: #94A3B8;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: var(--card); border-bottom: 1px solid var(--border); padding: 0.9rem 2rem; display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
    .brand { font-size: 1.15rem; font-weight: 800; display: flex; align-items: center; gap: 0.5rem; }
    .main-layout { display: flex; flex: 1; height: calc(100vh - 65px); }
    .sidebar { width: 380px; background: var(--card); border-right: 1px solid var(--border); padding: 1.25rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
    #map { flex: 1; height: 100%; background: #0b1523; }
    .corridor-banner { background: rgba(56, 189, 248, 0.1); border: 1px solid var(--sky); border-radius: 8px; padding: 0.85rem; font-size: 0.85rem; }
    .eta-box { background: #07111F; border: 1px solid var(--teal); border-radius: 8px; padding: 1rem; text-align: center; }
    .eta-title { color: var(--muted); font-size: 0.8rem; font-weight: 600; }
    .eta-val { font-size: 1.8rem; font-weight: 800; font-family: 'JetBrains Mono', monospace; color: var(--teal); }
    .fleet-card { background: #07111F; border: 1px solid var(--border); border-radius: 8px; padding: 1rem; cursor: pointer; transition: 0.2s; }
    .fleet-card:hover { border-color: var(--sky); }
    .status-badge { font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: 700; background: rgba(20, 184, 166, 0.2); color: var(--teal); }
    .status-transit { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>🚑</span>
      <span>JEEVANSETU FLEET TELEMETRY</span>
    </div>
    <div style="display:flex; gap:1.25rem; align-items:center;">
      <span style="font-size:0.85rem; color:var(--muted);">Kanpur Metro & NH-19 Grid</span>
      <a href="../index.html" style="color:var(--sky); text-decoration:none; font-weight:700; font-size:0.9rem;">← Back to Home</a>
    </div>
  </header>

  <div class="main-layout">
    <div class="sidebar">
      <div class="corridor-banner">
        <strong>🟢 NH-19 Green Corridor Active</strong>
        <p style="color:var(--muted); font-size:0.8rem; margin-top:0.25rem;">Live telemetry synchronized with traffic signal dispatch node.</p>
      </div>

      <div class="eta-box">
        <div class="eta-title">TARGET ETA (HALLET HOSPITAL)</div>
        <div class="eta-val" id="liveEta">-- MINS</div>
        <div style="font-size:0.8rem; color:var(--sky); margin-top:0.25rem;">Speed: <span id="liveSpeed">54.5</span> km/h | Mode: Siren Active</div>
      </div>

      <h3 style="font-size:1rem; font-weight:700; color:var(--muted);">ACTIVE FLEET UNITS</h3>
      <div id="fleetList" style="display:flex; flex-direction:column; gap:0.75rem;"></div>
    </div>

    <div id="map"></div>
  </div>

  <script>
    var map = L.map('map').setView([26.4350, 80.3550], 12);
    L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    }).addTo(map);

    var corridorPath = [
      [26.3785, 80.4421], // Rooma
      [26.3920, 80.4150], // Chakeri
      [26.4082, 80.3456], // Naubasta
      [26.4310, 80.3870], // Ramadevi
      [26.4450, 80.3100], // Govind Nagar
      [26.4650, 80.3120], // Harsh Nagar
      [26.4835, 80.3150]  // Hallet Hospital
    ];

    L.polyline(corridorPath, {
      color: '#10B981',
      weight: 4,
      dashArray: '8, 8',
      opacity: 0.8
    }).addTo(map);

    var markers = {};

    function updateLiveTelemetry() {
      fetch('/api/ambulances/live-telemetry')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          document.getElementById('liveEta').textContent = data.eta_minutes + ' MINS';
          document.getElementById('liveSpeed').textContent = data.speed_kmh;

          var ambulances = data.ambulances || [];
          var list = document.getElementById('fleetList');
          list.innerHTML = '';

          for (var i = 0; i < ambulances.length; i++) {
            var a = ambulances[i];
            var card = document.createElement('div');
            card.className = 'fleet-card';

            var isLive = (a.id === 1);
            var statusBadge = isLive 
              ? '<span class="status-badge status-transit">TRANSIT (EMERGENCY)</span>'
              : '<span class="status-badge">AVAILABLE</span>';

            card.innerHTML = [
              '<div style="display:flex; justify-content:space-between; margin-bottom:0.4rem;">',
                '<strong style="color:#fff; font-family:monospace;">' + a.vehicle_number + '</strong>',
                statusBadge,
              '</div>',
              '<div style="font-size:0.85rem; color:var(--muted);">Pilot: ' + a.driver_name + '</div>',
              '<div style="font-size:0.8rem; color:var(--sky); margin-top:0.25rem;">📞 ' + a.driver_phone + '</div>'
            ].join('');

            list.appendChild(card);

            if (!markers[a.id]) {
              var m = L.circleMarker([a.current_latitude, a.current_longitude], {
                radius: isLive ? 10 : 8,
                fillColor: isLive ? '#EF4444' : '#38BDF8',
                color: '#ffffff',
                weight: 2,
                fillOpacity: 1
              }).addTo(map);

              m.bindPopup('<b>' + a.vehicle_number + '</b><br>Type: ' + a.fleet_type + '<br>Pilot: ' + a.driver_name);
              markers[a.id] = m;
            } else {
              markers[a.id].setLatLng([a.current_latitude, a.current_longitude]);
              if (isLive) {
                markers[a.id].setStyle({ fillColor: '#EF4444' });
              }
            }
          }
        })
        .catch(function(err) { console.error(err); });
    }

    // Har 2 second me live telemetry update
    updateLiveTelemetry();
    setInterval(updateLiveTelemetry, 2000);
  </script>

  <script>
    // Live Moving Ambulance Telemetry Simulation
    var routeCoordinates = [
      [26.3842, 80.4215], // Rooma KM 442
      [26.4020, 80.4050], // Ahirwan
      [26.4251, 80.3871], // Ramadevi
      [26.4485, 80.3542], // Tatmill
      [26.4764, 80.3120]  // Hallet (LLR) Hospital
    ];

    if (typeof map !== 'undefined') {
      var ambIcon = L.divIcon({
        html: '<div style="font-size:24px; filter:drop-shadow(0 0 6px #10B981);">🚑</div>',
        className: 'custom-amb-icon',
        iconSize: [30, 30],
        iconAnchor: [15, 15]
      });

      var ambMarker = L.marker(routeCoordinates[0], { icon: ambIcon }).addTo(map);
      var currentStep = 0;
      var remainingMins = 14;

      function updateTelemetry() {
        if (currentStep < routeCoordinates.length - 1) {
          currentStep++;
          remainingMins = Math.max(2, remainingMins - 3);
        } else {
          currentStep = 0;
          remainingMins = 14;
        }

        ambMarker.setLatLng(routeCoordinates[currentStep]);
        var etaElem = document.querySelector('h1, .eta-val, [id*="eta"], div');
        var etaContainer = document.getElementById('targetEta') || document.querySelector('.card h2');
        
        // Update ETA Display
        var allTextNodes = document.querySelectorAll('*');
        allTextNodes.forEach(function(node) {
          if (node.children.length === 0 && node.textContent.includes('-- MINS')) {
            node.textContent = remainingMins + ' MINS';
            node.style.color = '#14B8A6';
          } else if (node.children.length === 0 && node.textContent.includes('MINS') && !isNaN(parseInt(node.textContent))) {
            node.textContent = remainingMins + ' MINS';
          }
        });
      }

      setInterval(updateTelemetry, 2500);
      updateTelemetry();

      // Populate Active Fleet Unit Card
      var fleetContainer = document.getElementById('activeFleet') || document.querySelector('.fleet-list') || document.body;
      var fleetCard = document.createElement('div');
      fleetCard.style.cssText = 'background:#0D1B2A; border:1px solid #1E354F; border-radius:8px; padding:12px; margin-top:12px; font-size:13px; color:#F8FAFC;';
      fleetCard.innerHTML = '<strong>ALS-UP78-AG-1021</strong><br><span style="color:#38BDF8;">Driver:</span> R. K. Yadav | <span style="color:#10B981;">Speed:</span> 58 km/h<br><span style="color:#94A3B8;">Corridor:</span> NH-19 Rooma &rarr; LLR Apex Bay';
      
      var sideCol = document.querySelector('.sidebar, .left-panel, div[style*="width"]');
      if (sideCol) sideCol.appendChild(fleetCard);
    }
  </script>
</body>
</html>
