<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JeevanSetu AI | ER Trauma Casualty Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07111F;
      --card: #0D1B2A;
      --border: #1E354F;
      --teal: #14B8A6;
      --sky: #38BDF8;
      --red: #EF4444;
      --yellow: #F59E0B;
      --text: #F8FAFC;
      --muted: #94A3B8;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; padding: 2rem 1.5rem; min-height: 100vh; }
    .wrapper { max-width: 1200px; margin: 0 auto; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1.25rem; margin-bottom: 2rem; }
    .header-bar a { color: var(--sky); text-decoration: none; font-weight: 700; font-size: 0.9rem; }
    .queue-table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .queue-table th { background: #0b1726; color: var(--muted); font-size: 0.8rem; text-align: left; padding: 1rem; border-bottom: 1px solid var(--border); text-transform: uppercase; }
    .queue-table td { padding: 1.1rem 1rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    .badge-crit { background: rgba(239, 68, 68, 0.2); color: var(--red); padding: 0.3rem 0.6rem; border-radius: 4px; font-weight: 800; font-size: 0.75rem; }
    .badge-admitted { background: rgba(20, 184, 166, 0.2); color: var(--teal); padding: 0.3rem 0.6rem; border-radius: 4px; font-weight: 800; font-size: 0.75rem; }
    .btn-admit { background: var(--teal); color: #07111F; border: none; padding: 0.45rem 0.9rem; border-radius: 6px; font-weight: 800; cursor: pointer; font-size: 0.8rem; }
    .btn-admit:hover { background: #0d9488; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header-bar">
      <div>
        <h2 style="font-size: 1.6rem;">🚨 Incoming Casualty & Triage Board</h2>
        <p style="color: var(--muted); font-size: 0.85rem;">Live emergency pre-arrivals across Kanpur trauma corridors</p>
      </div>
      <div style="display:flex; gap:1.25rem; align-items:center;">
        <a href="hospital-dashboard.html">Bed Grid</a>
        <a href="../index.html">← Citizen Home</a>
      </div>
    </div>

    <table class="queue-table">
      <thead>
        <tr>
          <th>Token ID</th>
          <th>Patient / Casualty</th>
          <th>Priority</th>
          <th>Assigned Unit</th>
          <th>Destination Facility</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="queueBody"></tbody>
    </table>
  </div>

  <script>
    function loadQueue() {
      fetch('/api/er/queue')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          var rows = data.queue || [];
          var tbody = document.getElementById('queueBody');
          tbody.innerHTML = '';

          if(!rows.length) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:var(--muted);">No pending emergency arrivals. Grid clear.</td></tr>';
            return;
          }

          for (var i = 0; i < rows.length; i++) {
            var item = rows[i];
            var tr = document.createElement('tr');

            var isAdmitted = (item.status === 'ADMITTED');
            var statusBadge = isAdmitted
              ? '<span class="badge-admitted">ADMITTED</span>'
              : '<span class="badge-crit">IN TRANSIT</span>';

            var actionBtn = isAdmitted
              ? '<span style="color:var(--muted); font-size:0.8rem;">Bay Assigned</span>'
              : '<button class="btn-admit" onclick="admit(' + item.id + ')">Admit Bay</button>';

            tr.innerHTML = [
              '<td style="font-family:monospace; color:var(--sky); font-weight:700;">JS-EM-KAN-' + String(item.id).padStart(4, '0') + '</td>',
              '<td><strong>' + item.patient_name + '</strong><br><small style="color:var(--muted);">' + item.symptom + '</small></td>',
              '<td><span class="badge-crit">' + item.priority + '</span></td>',
              '<td><strong style="color:#fff; font-family:monospace;">' + (item.vehicle_number || 'UP-78-AG-1021') + '</strong><br><small style="color:var(--teal);">' + (item.fleet_type || 'ALS') + '</small></td>',
              '<td>' + (item.hospital_name || 'SPM Hospital Rooma') + '</td>',
              '<td>' + statusBadge + '</td>',
              '<td>' + actionBtn + '</td>'
            ].join('');

            tbody.appendChild(tr);
          }
        })
        .catch(function(err) { console.error(err); });
    }

    function admit(id) {
      fetch('/api/er/admit/' + id, { method: 'POST' })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          loadQueue();
        })
        .catch(function(err) { console.error(err); });
    }

    loadQueue();
    setInterval(loadQueue, 3000);
  </script>
</body>
</html>
