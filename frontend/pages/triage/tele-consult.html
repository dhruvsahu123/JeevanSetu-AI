<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JeevanSetu AI | En-Route Vitals Relay & ER Tele-Consult</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07111F;
      --card: #0D1B2A;
      --border: #1E354F;
      --teal: #14B8A6;
      --sky: #38BDF8;
      --danger: #EF4444;
      --text: #F8FAFC;
      --muted: #94A3B8;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; padding: 2rem 1.5rem; min-height: 100vh; }
    .wrapper { max-width: 950px; margin: 0 auto; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1.25rem; margin-bottom: 2rem; }
    .header-bar a { color: var(--sky); text-decoration: none; font-weight: 700; font-size: 0.9rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.75rem; margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.8rem; color: var(--muted); font-weight: 700; margin-bottom: 0.35rem; }
    input, select { width: 100%; background: #07111F; border: 1px solid var(--border); color: #fff; padding: 0.75rem 0.9rem; border-radius: 8px; font-size: 0.95rem; margin-bottom: 1.2rem; outline: none; }
    input:focus, select:focus { border-color: var(--teal); }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
    .btn-relay { background: var(--teal); color: #07111F; border: none; padding: 0.9rem; border-radius: 8px; font-weight: 800; font-size: 1rem; cursor: pointer; width: 100%; transition: 0.2s; }
    .btn-relay:hover { background: #0d9488; }
    .relay-hud { display: none; background: #081728; border: 1px solid var(--border); border-radius: 10px; padding: 1.5rem; margin-top: 1.5rem; }
    .vitals-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.75rem; margin: 1rem 0; }
    .v-box { background: #07111F; border: 1px solid var(--border); border-radius: 6px; padding: 0.75rem; text-align: center; }
    .v-val { font-family: 'JetBrains Mono', monospace; font-size: 1.25rem; font-weight: 800; color: var(--sky); margin-top: 0.25rem; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header-bar">
      <div>
        <h2 style="font-size: 1.6rem;">📡 Paramedic Tele-Consult & Pre-Arrival Vitals Relay</h2>
        <p style="color: var(--muted); font-size: 0.85rem;">Direct live telemetry sync from en-route ambulance to Kanpur ER trauma desk</p>
      </div>
      <a href="../index.html">← Citizen Portal</a>
    </div>

    <div class="card">
      <div class="grid-3">
        <div>
          <label>AMBULANCE FLEET ID</label>
          <input type="text" id="ambId" value="UP-78-AG-1021 (ALS Rooma)">
        </div>
        <div>
          <label>HEART RATE (BPM)</label>
          <input type="number" id="hr" value="114" min="30" max="220">
        </div>
        <div>
          <label>BLOOD PRESSURE (SYS/DIA)</label>
          <input type="text" id="bp" value="88/58">
        </div>
      </div>

      <div class="grid-3">
        <div>
          <label>SpO2 SATURATION (%)</label>
          <input type="number" id="spo2" value="87" min="40" max="100">
        </div>
        <div>
          <label>GLASGOW COMA SCALE (GCS 3-15)</label>
          <input type="number" id="gcs" value="10" min="3" max="15">
        </div>
        <div>
          <label>ECG RHYTHM / CARDIAC MONITOR</label>
          <select id="ecg">
            <option value="Acute ST Elevation (STEMI)">Acute ST Elevation (STEMI)</option>
            <option value="Sinus Tachycardia">Sinus Tachycardia</option>
            <option value="Ventricular Tachycardia">Ventricular Tachycardia</option>
            <option value="Normal Sinus Rhythm">Normal Sinus Rhythm</option>
          </select>
        </div>
      </div>

      <button class="btn-relay" onclick="transmitVitals()">⚡ TRANSMIT LIVE VITALS TO CASUALTY DESK</button>

      <div class="relay-hud" id="relayHud">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <strong id="statusBadge" style="font-size:0.9rem; font-weight:800;"></strong>
          <span id="timeSync" style="color:var(--muted); font-family:monospace; font-size:0.8rem;"></span>
        </div>

        <div class="vitals-strip">
          <div class="v-box"><small style="color:var(--muted); font-size:0.7rem;">HEART RATE</small><div class="v-val" id="vHr"></div></div>
          <div class="v-box"><small style="color:var(--muted); font-size:0.7rem;">BLOOD PRESSURE</small><div class="v-val" id="vBp"></div></div>
          <div class="v-box"><small style="color:var(--muted); font-size:0.7rem;">SpO2 LEVEL</small><div class="v-val" id="vSpo2"></div></div>
          <div class="v-box"><small style="color:var(--muted); font-size:0.7rem;">GCS SCORE</small><div class="v-val" id="vGcs"></div></div>
        </div>

        <div style="background:#07111F; border:1px solid var(--border); border-radius:8px; padding:1rem;">
          <small style="color:var(--muted); font-size:0.75rem; font-weight:700;">TRAUMA REGISTRAR PRE-ARRIVAL DIRECTIVE:</small>
          <ul id="actionList" style="color:var(--teal); font-size:0.9rem; margin-top:0.4rem; padding-left:1.25rem;"></ul>
        </div>
      </div>
    </div>
  </div>

  <script>
    function transmitVitals() {
      var payload = {
        ambulance_id: document.getElementById('ambId').value,
        heart_rate: parseInt(document.getElementById('hr').value),
        blood_pressure: document.getElementById('bp').value,
        spo2: parseInt(document.getElementById('spo2').value),
        gcs_score: parseInt(document.getElementById('gcs').value),
        ecg_status: document.getElementById('ecg').value
      };

      fetch('/api/teleconsult/vitals', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        document.getElementById('relayHud').style.display = 'block';
        document.getElementById('timeSync').textContent = 'Synced: ' + data.timestamp;

        var isCrit = data.triage_alert === 'CODE_RED_CRITICAL';
        var badge = document.getElementById('statusBadge');
        badge.textContent = isCrit ? '🚨 CODE RED: RESUSCITATION BAY ACTIVATED' : '🟢 STABLE TRANSIT';
        badge.style.color = isCrit ? 'var(--danger)' : 'var(--teal)';

        document.getElementById('vHr').textContent = data.vitals_received.heart_rate;
        document.getElementById('vBp').textContent = data.vitals_received.bp;
        document.getElementById('vSpo2').textContent = data.vitals_received.spo2;
        document.getElementById('vGcs').textContent = data.vitals_received.gcs_score;

        var alist = document.getElementById('actionList');
        alist.innerHTML = '';
        for (var i = 0; i < data.er_pre_arrival_actions.length; i++) {
          var li = document.createElement('li');
          li.textContent = data.er_pre_arrival_actions[i];
          alist.appendChild(li);
        }
      })
      .catch(function(err) { console.error(err); });
    }
  </script>
</body>
</html>
