<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JeevanSetu AI | Kanpur Green Corridor Signal Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07111F;
      --card: #0D1B2A;
      --border: #1E354F;
      --teal: #14B8A6;
      --sky: #38BDF8;
      --danger: #EF4444;
      --yellow: #F59E0B;
      --text: #F8FAFC;
      --muted: #94A3B8;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; padding: 2rem 1.5rem; min-height: 100vh; }
    .wrapper { max-width: 1100px; margin: 0 auto; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1.25rem; margin-bottom: 2rem; }
    .header-bar a { color: var(--sky); text-decoration: none; font-weight: 700; font-size: 0.9rem; }
    
    .corridor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; }
    .corridor-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between; }
    .badge { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; padding: 0.25rem 0.5rem; border-radius: 4px; font-weight: 800; }
    .badge-standby { background: rgba(245, 158, 11, 0.2); color: var(--yellow); }
    .badge-locked { background: rgba(20, 184, 166, 0.2); color: var(--teal); border: 1px solid var(--teal); }
    
    .choke-tag { display: inline-block; background: #07111F; border: 1px solid var(--border); border-radius: 4px; padding: 0.2rem 0.5rem; font-size: 0.75rem; color: var(--muted); margin: 0.2rem 0.2rem 0.2rem 0; }
    .btn-preempt { background: var(--teal); color: #07111F; border: none; padding: 0.75rem; border-radius: 8px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 1rem; font-size: 0.9rem; transition: 0.2s; }
    .btn-preempt:hover { background: #0d9488; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header-bar">
      <div>
        <h2 style="font-size: 1.6rem;">🟢 Kanpur Green Corridor & Signal Preemption Desk</h2>
        <p style="color: var(--muted); font-size: 0.85rem;">Traffic Police synchronization & intelligent automated wave clearance</p>
      </div>
      <a href="../index.html">← Citizen Portal</a>
    </div>

    <div class="corridor-grid" id="corridorGrid"></div>
  </div>

  <script>
    function loadCorridors() {
      fetch('/api/traffic/corridors')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          var list = data.corridors || [];
          var grid = document.getElementById('corridorGrid');
          grid.innerHTML = '';

          for (var i = 0; i < list.length; i++) {
            var c = list[i];
            var card = document.createElement('div');
            card.className = 'corridor-card';

            var isLocked = (c.status === 'GREEN_LOCKED');
            var statusBadge = isLocked 
              ? '<span class="badge badge-locked">🟢 WAVE PREEMPTION ACTIVE</span>'
              : '<span class="badge badge-standby">🟡 STANDBY / SENSING</span>';

            var tagsHtml = c.chokepoints.map(function(cp) {
              return '<span class="choke-tag">' + cp + '</span>';
            }).join('');

            card.innerHTML = [
              '<div>',
                '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem;">',
                  '<strong style="color:var(--sky); font-family:monospace;">' + c.corridor_id + '</strong>',
                  statusBadge,
                '</div>',
                '<h3 style="font-size:1.15rem; margin-bottom:0.4rem;">' + c.name + '</h3>',
                '<p style="color:var(--muted); font-size:0.85rem; margin-bottom:1rem;">Corridor Span: <strong style="color:#fff;">' + c.length_km + ' KM</strong></p>',
                '<div style="margin-bottom:1rem;">',
                  '<small style="color:var(--muted); display:block; font-size:0.75rem; margin-bottom:0.3rem;">CONTROLLED INTERSECTIONS:</small>',
                  tagsHtml,
                '</div>',
              '</div>',
              '<div>',
                '<button class="btn-preempt" onclick="triggerPreempt('' + c.corridor_id + '')">' + (isLocked ? 'EXTEND GREEN WAVE' : '⚡ LOCK SIGNALS TO ALL GREEN') + '</button>',
              '</div>'
            ].join('');

            grid.appendChild(card);
          }
        })
        .catch(function(err) { console.error(err); });
    }

    function triggerPreempt(id) {
      fetch('/api/traffic/preempt/' + id, { method: 'POST' })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          alert('🚨 SUCCESS: ' + data.advisory);
          loadCorridors();
        })
        .catch(function(err) { console.error(err); });
    }

    document.addEventListener('DOMContentLoaded', loadCorridors);
  </script>
</body>
</html>
