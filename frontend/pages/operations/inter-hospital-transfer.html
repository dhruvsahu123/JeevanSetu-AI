<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JeevanSetu AI | Inter-Hospital Trauma Referral</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07111F;
      --card: #0D1B2A;
      --border: #1E354F;
      --teal: #14B8A6;
      --sky: #38BDF8;
      --danger: #EF4444;
      --text: #F8FAFC;
      --muted: #94A3B8;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; padding: 2rem 1.5rem; min-height: 100vh; }
    .wrapper { max-width: 900px; margin: 0 auto; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1.25rem; margin-bottom: 2rem; }
    .header-bar a { color: var(--sky); text-decoration: none; font-weight: 700; font-size: 0.9rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.75rem; margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.8rem; color: var(--muted); font-weight: 700; margin-bottom: 0.35rem; }
    input, select, textarea { width: 100%; background: #07111F; border: 1px solid var(--border); color: #fff; padding: 0.75rem 0.9rem; border-radius: 8px; font-size: 0.95rem; margin-bottom: 1.2rem; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--teal); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .btn-transfer { background: var(--teal); color: #07111F; border: none; padding: 0.85rem; border-radius: 8px; font-weight: 800; font-size: 1rem; cursor: pointer; width: 100%; }
    .btn-transfer:hover { background: #0d9488; }
    .result-box { display: none; background: #0b1c2e; border: 2px solid var(--teal); border-radius: 12px; padding: 1.5rem; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header-bar">
      <div>
        <h2 style="font-size: 1.6rem;">🔄 Inter-Hospital Trauma Handshake</h2>
        <p style="color: var(--muted); font-size: 0.85rem;">Kanpur Apex Transfer & Pre-arrival Cath Lab Clearance</p>
      </div>
      <a href="../index.html">← Citizen Portal</a>
    </div>

    <div class="card">
      <div class="grid-2">
        <div>
          <label>REFERRING ORIGIN FACILITY</label>
          <input type="text" id="srcHosp" value="SPM Hospital Research & Trauma (Rooma)">
        </div>
        <div>
          <label>DESTINATION APEX CENTRE</label>
          <select id="targetHosp">
            <option value="LLR (Hallet) Hospital Apex Trauma">LLR (Hallet) Hospital Apex Trauma (Govind Nagar/Swaroop Nagar)</option>
            <option value="Regency Hospital Cath Lab">Regency Hospital Tower-1 Cath Lab</option>
            <option value="Apollo Spectra Super-Specialty">Apollo Spectra Super-Specialty</option>
          </select>
        </div>
      </div>

      <label>CLINICAL JUSTIFICATION / APEX REQUIREMENT</label>
      <input type="text" id="clinicalReason" value="Acute Anterior Wall STEMI - Immediate Primary PCI Required">

      <label>ACTIVE VITALS & EN-ROUTE RESUSCITATION STATUS</label>
      <input type="text" id="vitals" value="Pulse 110 bpm, BP 85/55 mmHg, SpO2 91% on High Flow O2">

      <button class="btn-transfer" onclick="dispatchTransfer()">AUTHORIZE GREEN CORRIDOR TRANSFER</button>
    </div>

    <div class="result-box" id="resultBox">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <h3 style="color:var(--teal);">✅ TRANSFER DISPATCH CLEARANCE ACTIVE</h3>
        <span id="tokenBadge" style="background:var(--teal); color:#07111F; font-family:monospace; padding:0.3rem 0.6rem; border-radius:6px; font-weight:800;"></span>
      </div>
      <p id="protocolStatus" style="font-size:0.95rem; margin-bottom:0.75rem;"></p>
      <p id="corridorTime" style="color:var(--sky); font-weight:700; margin-bottom:0.75rem;"></p>
      <p id="alertNote" style="color:var(--muted); font-size:0.85rem;"></p>
      <div style="margin-top:1.25rem;">
        <button onclick="window.location.href='ambulance-tracking.html'" style="background:var(--sky); color:#07111F; border:none; padding:0.6rem 1.2rem; border-radius:6px; font-weight:700; cursor:pointer;">Open Live Transit Corridor</button>
      </div>
    </div>
  </div>

  <script>
    function dispatchTransfer() {
      var src = document.getElementById('srcHosp').value;
      var tgt = document.getElementById('targetHosp').value;
      var reason = document.getElementById('clinicalReason').value;
      var vitals = document.getElementById('vitals').value;

      fetch('/api/transfers/initiate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ source_hospital: src, target_hospital: tgt, clinical_reason: reason, vitals: vitals })
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('tokenBadge').textContent = data.transfer_token;
        document.getElementById('protocolStatus').textContent = data.protocol;
        document.getElementById('corridorTime').textContent = '⏱️ ETA: ' + data.estimated_corridor_time;
        document.getElementById('alertNote').textContent = 'Destination Alert: ' + data.target_facility_alert;
      })
      .catch(function(err) { console.error(err); });
    }
  </script>
</body>
</html>
