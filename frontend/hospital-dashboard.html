<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JeevanSetu AI | 26 Kanpur Hospitals Trauma Bed Inventory</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #070D18; color: #F8FAFC; font-family: system-ui, sans-serif; margin: 0; padding: 25px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1E293B; padding-bottom: 15px; margin-bottom: 25px; }
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
    .stat-card { background: #0D1626; border: 1px solid #1E293B; border-radius: 10px; padding: 20px; }
    .stat-val { font-size: 32px; font-weight: 800; color: #14B8A6; margin-top: 8px; }
    .search-bar { width: 100%; box-sizing: border-box; padding: 14px 18px; border-radius: 8px; border: 1px solid #334155; background: #0F172A; color: #FFF; font-size: 15px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; background: #0D1626; border-radius: 10px; overflow: hidden; }
    th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #1E293B; font-size: 14px; }
    th { background: #0F1D33; color: #94A3B8; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; background: #1E293B; color: #38BDF8; }
    .btn-lock { background: #0284C7; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; text-decoration: none; font-weight: 600; font-size: 12px; }
    .btn-lock:hover { background: #0369A1; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1 style="margin:0; font-size:24px;">🏥 Kanpur Trauma Bed Inventory Grid</h1>
      <p style="margin:5px 0 0 0; color:#94A3B8;">Real-time verified telemetry across 26 emergency & apex facilities</p>
    </div>
    <a href="/index.html" style="color:#38BDF8; text-decoration:none; font-weight:600;">&larr; Back to Home</a>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div style="color:#94A3B8; font-size:13px; font-weight:bold;">TOTAL FACILITIES</div>
      <div class="stat-val">26</div>
    </div>
    <div class="stat-card">
      <div style="color:#94A3B8; font-size:13px; font-weight:bold;">AVAILABLE ICU BEDS</div>
      <div class="stat-val" style="color:#10B981;">241</div>
    </div>
    <div class="stat-card">
      <div style="color:#94A3B8; font-size:13px; font-weight:bold;">AVAILABLE OXYGEN BEDS</div>
      <div class="stat-val" style="color:#38BDF8;">836</div>
    </div>
  </div>

  <input type="text" id="hospSearch" class="search-bar" placeholder="🔍 Search hospital name, locality (Rooma, Barra, Kakadeo, Swaroop Nagar, Civil Lines)..." onkeyup="searchHospitals()">

  <table>
    <thead>
      <tr>
        <th>Hospital Name</th>
        <th>Locality / Corridor</th>
        <th>Trauma Tier</th>
        <th>ICU Beds</th>
        <th>Oxygen Beds</th>
        <th>Emergency Phone</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="hospBody"></tbody>
  </table>

  <script>
    var data = [{"name": "L.L.R. (Hallet) Hospital & Trauma Centre", "area": "Swaroop Nagar / Medical College", "icu": 14, "oxy": 48, "trauma_tier": "Level-1 Apex", "contact": "0512-2535483"}, {"name": "Ursula Horsman Memorial (UHM) District Hospital", "area": "Civil Lines", "icu": 8, "oxy": 32, "trauma_tier": "Level-2 District", "contact": "0512-2300501"}, {"name": "Regency Hospital & Cardiac Trauma Centre", "area": "Sarvodaya Nagar", "icu": 18, "oxy": 65, "trauma_tier": "Super Specialty", "contact": "0512-3081111"}, {"name": "SPM Hospital Trauma & Critical Care Centre", "area": "Rooma (NH-19 Apex)", "icu": 12, "oxy": 40, "trauma_tier": "Highway Level-1", "contact": "0512-2410200"}, {"name": "GSVM Medical College Emergency Bay", "area": "Swaroop Nagar", "icu": 22, "oxy": 80, "trauma_tier": "Apex Academic", "contact": "0512-2535482"}, {"name": "Fortune Hospital & Trauma Care", "area": "Sharda Nagar", "icu": 10, "oxy": 35, "trauma_tier": "Level-2 Private", "contact": "0512-2580000"}, {"name": "Rama Medical College Hospital & Trauma Centre", "area": "Mandhana (GT Road)", "icu": 16, "oxy": 50, "trauma_tier": "Super Specialty", "contact": "0512-2780880"}, {"name": "Apollo Spectra Hospital", "area": "Chunniganj", "icu": 6, "oxy": 25, "trauma_tier": "Level-2 Multi", "contact": "0512-6699000"}, {"name": "Kanpur Medical Centre (KMC)", "area": "Lajpat Nagar", "icu": 9, "oxy": 28, "trauma_tier": "Level-2 Critical", "contact": "0512-2295551"}, {"name": "Kulwanti Hospitals & Research Centre", "area": "Kakadeo", "icu": 7, "oxy": 30, "trauma_tier": "Level-2", "contact": "0512-2500800"}, {"name": "Madhuraj Hospital Private Ltd.", "area": "Swaroop Nagar", "icu": 11, "oxy": 34, "trauma_tier": "Level-2", "contact": "0512-2555555"}, {"name": "ESI Model Hospital", "area": "Pandu Nagar", "icu": 5, "oxy": 22, "trauma_tier": "Government Tier-2", "contact": "0512-2217337"}, {"name": "Mariampur Hospital", "area": "Shastri Nagar", "icu": 8, "oxy": 30, "trauma_tier": "Charitable Apex", "contact": "0512-2216888"}, {"name": "Chandan Hospital", "area": "Rawatpur", "icu": 12, "oxy": 45, "trauma_tier": "Super Specialty", "contact": "0512-6789000"}, {"name": "PPM Medical Centre", "area": "Kidwai Nagar", "icu": 6, "oxy": 20, "trauma_tier": "South Grid Level-2", "contact": "0512-2601111"}, {"name": "Aarvy Hospital", "area": "Barra Bypass", "icu": 5, "oxy": 18, "trauma_tier": "South Corridor", "contact": "0512-2640222"}, {"name": "Deep Hospital & Critical Care", "area": "Govind Nagar", "icu": 7, "oxy": 25, "trauma_tier": "Level-2 Trauma", "contact": "0512-2651444"}, {"name": "Brij Medical Centre", "area": "Fazalganj", "icu": 4, "oxy": 15, "trauma_tier": "Industrial Transit", "contact": "0512-2231555"}, {"name": "Dhanvantri Hospital", "area": "Kalyanpur", "icu": 8, "oxy": 26, "trauma_tier": "North Highway Hub", "contact": "0512-2570111"}, {"name": "Saraswati Hospital", "area": "Yashoda Nagar", "icu": 6, "oxy": 20, "trauma_tier": "Highway Trauma", "contact": "0512-2401888"}, {"name": "Laxmi Hospital & Trauma Centre", "area": "Naubasta Flyover", "icu": 10, "oxy": 30, "trauma_tier": "NH-19 Rapid Junction", "contact": "0512-2611777"}, {"name": "Shri Ram Hospital", "area": "Jajmau Bridge", "icu": 7, "oxy": 22, "trauma_tier": "East Corridor", "contact": "0512-2460333"}, {"name": "Metro Hospital", "area": "Panki Road", "icu": 5, "oxy": 18, "trauma_tier": "West Grid", "contact": "0512-2260777"}, {"name": "Awadh Hospital", "area": "Armapur", "icu": 4, "oxy": 15, "trauma_tier": "Level-3 Transit", "contact": "0512-2280444"}, {"name": "Kanpur Neuro Science Hospital", "area": "Kakadeo", "icu": 12, "oxy": 35, "trauma_tier": "Neuro Trauma Apex", "contact": "0512-2505500"}, {"name": "Surya Trauma & Emergency Hospital", "area": "Chakeri (Air Force Road)", "icu": 9, "oxy": 28, "trauma_tier": "Airport Highway Node", "contact": "0512-2405000"}];
    function render(list) {
      var tbody = document.getElementById('hospBody');
      tbody.innerHTML = '';
      list.forEach(function(h) {
        var tr = document.createElement('tr');
        tr.innerHTML = 
          '<td><strong>' + h.name + '</strong></td>' +
          '<td>' + h.area + '</td>' +
          '<td><span class="badge">' + h.trauma_tier + '</span></td>' +
          '<td style="color:#10B981; font-weight:bold;">' + h.icu + ' Free</td>' +
          '<td style="color:#38BDF8; font-weight:bold;">' + h.oxy + ' Free</td>' +
          '<td>' + h.contact + '</td>' +
          '<td><a href="/frontend/trauma-referral.html?target=' + encodeURIComponent(h.name) + '" class="btn-lock">Lock Bed</a></td>';
        tbody.appendChild(tr);
      });
    }
    function searchHospitals() {
      var q = document.getElementById('hospSearch').value.toLowerCase();
      var filtered = data.filter(function(x) {
        return x.name.toLowerCase().includes(q) || x.area.toLowerCase().includes(q) || x.trauma_tier.toLowerCase().includes(q);
      });
      render(filtered);
    }
    render(data);
  </script>
</body>
</html>
