<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JeevanSetu AI | 26 Kanpur Hospital Trauma Bed Grid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07111F;
      --card: #0D1B2A;
      --border: #1E354F;
      --teal: #14B8A6;
      --sky: #38BDF8;
      --red: #EF4444;
      --text: #F8FAFC;
      --muted: #94A3B8;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; padding: 2rem 1.5rem; min-height: 100vh; }
    .wrapper { max-width: 1200px; margin: 0 auto; }
    .top-nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1.25rem; margin-bottom: 2rem; }
    .top-nav a { color: var(--sky); text-decoration: none; font-weight: 700; font-size: 0.9rem; }
    
    .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; }
    .stat-card h3 { font-size: 1.8rem; font-family: 'JetBrains Mono', monospace; color: var(--teal); margin-top: 0.25rem; }

    .search-row { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
    .search-row input { flex: 1; background: var(--card); border: 1px solid var(--border); color: #fff; padding: 0.85rem 1.2rem; border-radius: 8px; font-size: 1rem; outline: none; }
    .search-row input:focus { border-color: var(--sky); }

    .hospital-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.25rem; }
    .hosp-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; display: flex; flex-direction: column; justify-content: space-between; }
    .hosp-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; }
    .trauma-badge { font-size: 0.75rem; background: rgba(56, 189, 248, 0.15); color: var(--sky); padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: 700; }
    
    .bed-meters { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; background: #07111F; border: 1px solid var(--border); border-radius: 8px; padding: 0.85rem; margin: 1rem 0; }
    .bed-counter { display: flex; align-items: center; justify-content: space-between; margin-top: 0.25rem; }
    .btn-step { background: #1E354F; color: #fff; border: none; width: 24px; height: 24px; border-radius: 4px; font-weight: 800; cursor: pointer; }
    .btn-step:hover { background: var(--teal); color: #000; }

    .card-actions { display: flex; gap: 0.75rem; }
    .btn-call { flex: 1; background: rgba(20, 184, 166, 0.15); border: 1px solid var(--teal); color: var(--teal); text-decoration: none; padding: 0.5rem; border-radius: 6px; font-weight: 700; font-size: 0.85rem; text-align: center; }
    .btn-call:hover { background: var(--teal); color: var(--bg); }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="top-nav">
      <div>
        <h2 style="font-size: 1.6rem;">🏥 Kanpur Trauma Bed Inventory Grid</h2>
        <p style="color: var(--muted); font-size: 0.85rem;">Real-time telemetry across 26 verified emergency facilities</p>
      </div>
      <a href="../index.html">← Back to Home</a>
    </div>

    <div class="stats-bar">
      <div class="stat-card">
        <span style="color:var(--muted); font-size:0.8rem;">TOTAL FACILITIES</span>
        <h3 id="totalHosp">26</h3>
      </div>
      <div class="stat-card">
        <span style="color:var(--muted); font-size:0.8rem;">AVAILABLE ICU BEDS</span>
        <h3 id="availIcu" style="color:var(--teal);">--</h3>
      </div>
      <div class="stat-card">
        <span style="color:var(--muted); font-size:0.8rem;">AVAILABLE OXYGEN BEDS</span>
        <h3 id="availOxy" style="color:var(--sky);">--</h3>
      </div>
    </div>

    <div class="search-row">
      <input type="text" id="hospSearch" placeholder="Search hospital name, locality (Rooma, Barra, Kakadeo, Swaroop Nagar)..." oninput="filterHospitals()">
    </div>

    <div class="hospital-grid" id="hospGrid"></div>
  </div>

  <script>
    var hospitalData = [];

    function updateStats() {
      var icu = 0, oxy = 0;
      for (var i = 0; i < hospitalData.length; i++) {
        icu += (hospitalData[i].icu_available || 0);
        oxy += (hospitalData[i].oxygen_available || 0);
      }
      document.getElementById('totalHosp').textContent = hospitalData.length;
      document.getElementById('availIcu').textContent = icu;
      document.getElementById('availOxy').textContent = oxy;
    }

    function renderGrid(list) {
      var grid = document.getElementById('hospGrid');
      grid.innerHTML = '';
      if (!list || list.length === 0) {
        grid.innerHTML = '<p style="color:var(--muted);">No trauma facilities matching criteria.</p>';
        return;
      }

      for (var i = 0; i < list.length; i++) {
        var h = list[i];
        var card = document.createElement('div');
        card.className = 'hosp-card';

        var content = [
          '<div>',
            '<div class="hosp-header">',
              '<h4 style="font-size:1.05rem; max-width:70%;">' + h.name + '</h4>',
              '<span class="trauma-badge">' + h.trauma_level + '</span>',
            '</div>',
            '<p style="color:var(--muted); font-size:0.82rem; margin-bottom:0.25rem;">📍 ' + h.locality + '</p>',
            '<p style="color:var(--sky); font-size:0.8rem; font-family:monospace;">Distance: ~' + h.distance_km + ' km</p>',
            '<div class="bed-meters">',
              '<div>',
                '<small style="color:var(--muted); font-size:0.75rem;">ICU BEDS</small>',
                '<div class="bed-counter">',
                  '<strong style="color:var(--teal); font-family:monospace;" id="icu-' + h.id + '">' + (h.icu_available || 0) + ' / ' + (h.icu_total || 0) + '</strong>',
                  '<div>',
                    '<button class="btn-step" onclick="adjustBed(' + h.id + ', -1, 0)">-</button> ',
                    '<button class="btn-step" onclick="adjustBed(' + h.id + ', 1, 0)">+</button>',
                  '</div>',
                '</div>',
              '</div>',
              '<div>',
                '<small style="color:var(--muted); font-size:0.75rem;">O2 BEDS</small>',
                '<div class="bed-counter">',
                  '<strong style="color:var(--sky); font-family:monospace;" id="oxy-' + h.id + '">' + (h.oxygen_available || 0) + ' / ' + (h.oxygen_total || 0) + '</strong>',
                  '<div>',
                    '<button class="btn-step" onclick="adjustBed(' + h.id + ', 0, -1)">-</button> ',
                    '<button class="btn-step" onclick="adjustBed(' + h.id + ', 0, 1)">+</button>',
                  '</div>',
                '</div>',
              '</div>',
            '</div>',
          '</div>',
          '<div class="card-actions">',
            '<a href="tel:' + h.phone + '" class="btn-call">📞 Emergency Desk (' + h.phone + ')</a>',
          '</div>'
        ].join('');

        card.innerHTML = content;
        grid.appendChild(card);
      }
    }

    function filterHospitals() {
      var q = document.getElementById('hospSearch').value.toLowerCase();
      var filtered = [];
      for (var i = 0; i < hospitalData.length; i++) {
        var h = hospitalData[i];
        if (h.name.toLowerCase().indexOf(q) !== -1 ||
            h.locality.toLowerCase().indexOf(q) !== -1 ||
            h.trauma_level.toLowerCase().indexOf(q) !== -1) {
          filtered.push(h);
        }
      }
      renderGrid(filtered);
    }

    function adjustBed(hospId, deltaIcu, deltaOxy) {
      fetch('/api/hospitals/' + hospId + '/beds', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ delta_icu: deltaIcu, delta_oxy: deltaOxy })
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.status === 'success') {
          for (var i = 0; i < hospitalData.length; i++) {
            if (hospitalData[i].id === hospId) {
              hospitalData[i].icu_available = data.icu_available;
              hospitalData[i].oxygen_available = data.oxygen_available;
              document.getElementById('icu-' + hospId).textContent = data.icu_available + ' / ' + hospitalData[i].icu_total;
              document.getElementById('oxy-' + hospId).textContent = data.oxygen_available + ' / ' + hospitalData[i].oxygen_total;
              updateStats();
              break;
            }
          }
        }
      })
      .catch(function(err) { console.error(err); });
    }

    function fetchHospitals() {
      fetch('/api/hospitals')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          hospitalData = data.hospitals || [];
          updateStats();
          renderGrid(hospitalData);
        })
        .catch(function(err) { console.error(err); });
    }

    document.addEventListener('DOMContentLoaded', fetchHospitals);
  </script>
</body>
</html>
