<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Citizen Health Console | JeevanSetu AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <!-- QRCode.js Library for instant dynamic QR generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { background-color: #f8fafc; }
    .dash-header { background: #0f172a; color: #fff; padding: 1.25rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .dash-wrap { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; display: grid; grid-template-columns: 1fr 1.2fr; gap: 2rem; }
    @media (max-width: 800px) { .dash-wrap { grid-template-columns: 1fr; } }
    .box-card { background: #fff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 1.75rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .box-card h2 { font-size: 1.25rem; margin-top: 0; color: #0f172a; margin-bottom: 1.25rem; }
    .field-grp { margin-bottom: 1rem; }
    .field-grp label { display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.3rem; }
    .field-grp input, .field-grp select { width: 100%; padding: 0.65rem 0.85rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; box-sizing: border-box; }
    .qr-area { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    #qrcode { padding: 1rem; background: #fff; border: 2px dashed #94a3b8; border-radius: 12px; margin-bottom: 1rem; min-height: 180px; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <header class="dash-header">
    <div style="display:flex; align-items:center; gap:0.6rem;">
      <span class="logo-mark" style="background:#2563eb; color:#fff; width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:6px; font-weight:800;">+</span>
      <strong style="font-size:1.15rem;">JeevanSetu Citizen Vault</strong>
    </div>
    <div>
      <a href="index.html" class="btn btn-secondary btn-sm" style="background:#334155; color:#fff; border:none; text-decoration:none;">Public Grid</a>
      <button onclick="logout()" class="btn btn-secondary btn-sm" style="background:#dc2626; color:#fff; border:none; margin-left:0.5rem; cursor:pointer;">Sign Out</button>
    </div>
  </header>

  <main class="dash-wrap">
    <!-- QR HEALTH CARD GENERATOR -->
    <section class="box-card qr-area">
      <h2>Emergency QR Health Card</h2>
      <p style="font-size:0.85rem; color:#64748b; margin-top:0; margin-bottom:1.5rem;">Save or print this QR. First responders can scan this to view vital medical info without unlocking your phone.</p>
      
      <div id="qrcode"></div>
      <a id="previewCardLink" href="#" target="_blank" class="btn btn-secondary btn-sm" style="margin-top:0.5rem; text-decoration:none;">🔍 Preview Scanned Card</a>
    </section>

    <!-- HEALTH PROFILE FORM -->
    <section class="box-card">
      <h2>Emergency Medical Profile</h2>
      <form id="healthProfileForm">
        <div class="field-grp">
          <label>Full Name</label>
          <input type="text" id="profName" value="Citizen User" required />
        </div>
        <div class="field-grp">
          <label>Blood Group</label>
          <select id="profBlood">
            <option value="O+">O Positive (O+)</option>
            <option value="O-">O Negative (O-)</option>
            <option value="A+">A Positive (A+)</option>
            <option value="A-">A Negative (A-)</option>
            <option value="B+">B Positive (B+)</option>
            <option value="B-">B Negative (B-)</option>
            <option value="AB+">AB Positive (AB+)</option>
            <option value="AB-">AB Negative (AB-)</option>
          </select>
        </div>
        <div class="field-grp">
          <label>Known Chronic Conditions / Implants</label>
          <input type="text" id="profConditions" placeholder="e.g. Type 2 Diabetes, Cardiac Stent" />
        </div>
        <div class="field-grp">
          <label>Critical Drug Allergies</label>
          <input type="text" id="profAllergies" placeholder="e.g. Penicillin, Aspirin, Sulfa drugs" />
        </div>
        <div class="field-grp">
          <label>Emergency Guardian Phone</label>
          <input type="tel" id="profGuardianPhone" placeholder="+91 9876543210" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:1.25rem;">Update & Refresh QR</button>
      </form>
    </section>
  </main>

  <script>
    let qrInstance = null;

    function renderQR() {
      const name = encodeURIComponent(document.getElementById('profName').value.trim());
      const blood = encodeURIComponent(document.getElementById('profBlood').value);
      const cond = encodeURIComponent(document.getElementById('profConditions').value.trim());
      const alg = encodeURIComponent(document.getElementById('profAllergies').value.trim());
      const phone = encodeURIComponent(document.getElementById('profGuardianPhone').value.trim());

      // Base URL pointing directly to emergency-card.html
      const currentHost = window.location.origin + window.location.pathname.replace('customer-dashboard.html', '');
      const scanUrl = `${currentHost}emergency-card.html?n=${name}&b=${blood}&c=${cond}&a=${alg}&p=${phone}`;

      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = "";
      qrInstance = new QRCode(qrContainer, {
        text: scanUrl,
        width: 170,
        height: 170,
        colorDark: "#0f172a",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });

      document.getElementById('previewCardLink').href = scanUrl;
    }

    // Load initial user info
    document.addEventListener('DOMContentLoaded', () => {
      const user = localStorage.getItem('user');
      if (user) {
        try {
          const u = JSON.parse(user);
          if (u.name) document.getElementById('profName').value = u.name;
          if (u.phone) document.getElementById('profGuardianPhone').value = u.phone;
        } catch(e) {}
      }
      renderQR();
    });

    document.getElementById('healthProfileForm').addEventListener('submit', (e) => {
      e.preventDefault();
      renderQR();
      alert("Emergency QR Health Profile updated successfully!");
    });

    function logout() {
      localStorage.removeItem('user');
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
