<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JeevanSetu AI | Highway Black Spot Proximity Radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07111F;
      --card: #0D1B2A;
      --border: #1E354F;
      --teal: #14B8A6;
      --sky: #38BDF8;
      --danger: #EF4444;
      --yellow: #F59E0B;
      --text: #F8FAFC;
      --muted: #94A3B8;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; padding: 2rem 1.5rem; min-height: 100vh; }
    .wrapper { max-width: 1050px; margin: 0 auto; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1.25rem; margin-bottom: 2rem; }
    .header-bar a { color: var(--sky); text-decoration: none; font-weight: 700; font-size: 0.9rem; }

    .hud-radar { background: #040911; border: 2px solid var(--border); border-radius: 14px; padding: 2rem; text-align: center; position: relative; overflow: hidden; margin-bottom: 2rem; }
    .radar-circle { width: 180px; height: 180px; border-radius: 50%; border: 2px dashed var(--teal); margin: 0 auto 1.5rem; display: flex; align-items: center; justify-content: center; position: relative; }
    .radar-sweep { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 2px solid transparent; border-top-color: var(--teal); animation: sweep 2s linear infinite; }
    @keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .radar-danger { border-color: var(--danger) !important; animation: redGlow 1s infinite alternate; }
    @keyframes redGlow { from { box-shadow: 0 0 10px rgba(239,68,68,0.2); } to { box-shadow: 0 0 35px rgba(239,68,68,0.6); } }

    .dist-val { font-family: 'JetBrains Mono', monospace; font-size: 2.8rem; font-weight: 800; color: var(--teal); }
    .btn-arm { background: var(--teal); color: #07111F; border: none; padding: 0.85rem 2rem; border-radius: 30px; font-weight: 800; font-size: 0.95rem; cursor: pointer; }
    .btn-arm:hover { background: #0d9488; }

    .spot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.25rem; }
    .spot-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; }
    .badge { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: 800; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header-bar">
      <div>
        <h2 style="font-size: 1.6rem;">📡 Highway Black Spot Proximity Radar</h2>
        <p style="color: var(--muted); font-size: 0.85rem;">Autonomous GPS geo-fence radar with acoustic collision frequency pacer</p>
      </div>
      <a href="../index.html">← Citizen Portal</a>
    </div>

    <!-- Active Radar HUD -->
    <div class="hud-radar" id="radarHud">
      <div class="radar-circle" id="radarCircle">
        <div class="radar-sweep"></div>
        <div style="font-size: 2rem; z-index: 2;" id="radarIcon">🚑</div>
      </div>

      <small style="color:var(--muted); font-weight:700; text-transform:uppercase;">DISTANCE TO NEAREST CRASH ZONE</small>
      <div class="dist-val" id="distHud">420 METERS</div>
      <p id="targetName" style="color:var(--sky); font-size:1.1rem; font-weight:700; margin:0.35rem 0 1.2rem;">NH-19 Rooma Flyover Cut (KM 442)</p>

      <button class="btn-arm" id="btnArmRadar" onclick="armAudioRadar()">🔊 ARM COLLISION PROXIMITY ACOUSTICS</button>
      <div style="font-family:monospace; font-size:0.8rem; color:var(--muted); margin-top:0.75rem;" id="radarStatus">
        STATUS: PASSIVE (Acoustics Standby)
      </div>
    </div>

    <!-- Monitored Black Spots -->
    <h3 style="font-size:1.15rem; color:var(--sky); margin-bottom:1rem;">CALIBRATED KANPUR HIGHWAY BLACK SPOTS</h3>
    <div class="spot-grid" id="spotGrid"></div>
  </div>

  <script>
    var isArmed = false;
    var audioCtx = null;
    var currentDist = 420;
    var beepInterval = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playBeep(freq) {
      if (!audioCtx || !isArmed) return;
      var now = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.1);
    }

    function scheduleBeeps() {
      if (beepInterval) clearInterval(beepInterval);
      if (!isArmed) return;

      var delay = Math.max(250, currentDist * 3);
      beepInterval = setInterval(function() {
        playBeep(currentDist < 300 ? 1200 : 880);
      }, delay);
    }

    function armAudioRadar() {
      initAudio();
      isArmed = true;
      document.getElementById('btnArmRadar').textContent = '🟢 RADAR ACTIVE & PACING';
      document.getElementById('btnArmRadar').style.background = '#1E354F';
      document.getElementById('btnArmRadar').style.color = 'var(--sky)';
      document.getElementById('radarStatus').textContent = 'STATUS: ACTIVE (Geiger acoustic collision telemetry streaming)';

      scheduleBeeps();

      // Simulate vehicle motion approaching black spot
      setInterval(function() {
        if (currentDist > 80) {
          currentDist -= 25;
        } else {
          currentDist = 450;
        }

        document.getElementById('distHud').textContent = currentDist + ' METERS';
        if (currentDist < 200) {
          document.getElementById('radarHud').classList.add('radar-danger');
          document.getElementById('distHud').style.color = 'var(--danger)';
          document.getElementById('radarIcon').textContent = '⚠️';
        } else {
          document.getElementById('radarHud').classList.remove('radar-danger');
          document.getElementById('distHud').style.color = 'var(--teal)';
          document.getElementById('radarIcon').textContent = '🚑';
        }
        scheduleBeeps();
      }, 1800);
    }

    function loadBlackspots() {
      fetch('/api/telemetry/blackspots')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          var grid = document.getElementById('spotGrid');
          grid.innerHTML = '';
          var list = data.black_spots || [];

          for (var i = 0; i < list.length; i++) {
            var b = list[i];
            var card = document.createElement('div');
            card.className = 'spot-card';
            card.innerHTML = [
              '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">',
                '<strong style="font-family:monospace; color:var(--sky);">' + b.id + '</strong>',
                '<span class="badge" style="background:rgba(239,68,68,0.2); color:var(--danger);">' + b.risk_level + '</span>',
              '</div>',
              '<h4 style="font-size:1.05rem; margin-bottom:0.35rem;">' + b.name + '</h4>',
              '<p style="color:var(--muted); font-size:0.8rem; margin-bottom:0.75rem;">GPS: ' + b.lat + '° N, ' + b.lng + '° E</p>',
              '<div style="background:#07111F; border:1px solid var(--border); border-radius:6px; padding:0.6rem; font-size:0.78rem; color:var(--text);">',
                '⚠️ <strong>Advisory:</strong> ' + b.advisory,
              '</div>'
            ].join('');
            grid.appendChild(card);
          }
        });
    }

    document.addEventListener('DOMContentLoaded', loadBlackspots);
  </script>
</body>
</html>
