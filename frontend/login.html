<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | JeevanSetu AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .auth-wrapper {
      min-height: calc(100vh - 4.5rem);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
      background: var(--bg-body, #f8fafc);
    }
    .auth-card {
      background: #ffffff;
      border: 1px solid var(--border-color, #e2e8f0);
      border-radius: var(--radius-lg, 12px);
      padding: 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .auth-header { text-align: center; margin-bottom: 2rem; }
    .auth-header h2 { font-size: 1.6rem; font-weight: 800; color: #0f172a; }
    .auth-header p { color: #64748b; font-size: 0.9rem; margin-top: 0.3rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: #334155; }
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: #2563eb; }
    .status-msg {
      display: none;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.88rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    .status-msg.error { background: #fee2e2; color: #dc2626; display: block; }
    .status-msg.info { background: #e0f2fe; color: #0284c7; display: block; }
    .auth-footer { text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: #64748b; }
    .auth-footer a { color: #2563eb; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="navbar container">
      <a href="index.html" class="logo">
        <span class="logo-mark">+</span>
        <span class="logo-text">Jeevan<strong>Setu</strong><span class="ai-badge">AI Grid</span></span>
      </a>
      <div><a href="register.html" class="btn btn-secondary btn-sm">Register</a></div>
    </nav>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Sign In to JeevanSetu</h2>
        <p>Access your health profile or response console</p>
      </div>

      <div id="statusAlert" class="status-msg"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="staff@hospital.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">Sign In</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Register here</a>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = "https://jeevansetu-ai-7e5y.onrender.com/api";
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const statusAlert = document.getElementById('statusAlert');

    function showStatus(text, type = 'error') {
      statusAlert.textContent = text;
      statusAlert.className = `status-msg ${type}`;
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      loginBtn.disabled = true;
      loginBtn.textContent = 'Connecting to Cloud...';
      showStatus('Waking cloud server & verifying credentials... Please wait (may take 20s if asleep).', 'info');

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 60000); // 60s timeout for Render cold start

        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        const data = await res.json();

        if (res.ok) {
          showStatus('Login successful! Redirecting...', 'info');
          localStorage.setItem('user', JSON.stringify(data.user));
          if (data.token) localStorage.setItem('token', data.token);

          // Role matching check (Hospital, Staff, Ambulance, Citizen)
          const role = (data.user?.role || '').toUpperCase();
          setTimeout(() => {
            if (role === 'HOSPITAL' || role === 'STAFF' || role === 'HOSPITAL_STAFF') {
              window.location.href = 'hospital-dashboard.html';
            } else if (role === 'AMBULANCE') {
              window.location.href = 'ambulance-tracking.html';
            } else {
              window.location.href = 'customer-dashboard.html';
            }
          }, 600);
        } else {
          showStatus(data.error || data.message || 'Invalid email or password.');
          loginBtn.disabled = false;
          loginBtn.textContent = 'Sign In';
        }
      } catch (err) {
        if (err.name === 'AbortError') {
          showStatus('Connection timed out. Render backend took too long to wake up. Please retry.');
        } else {
          showStatus('Server unreachable. Checking backend connection...');
        }
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
