<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | JeevanSetu AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 48px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 20px;
      font-weight: 700;
      color: #0284c7;
      text-decoration: none;
    }

    .brand span {
      color: #64748b;
      font-weight: 400;
      font-size: 14px;
      margin-left: 4px;
    }

    .register-btn {
      padding: 8px 18px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      color: #334155;
      font-size: 14px;
      text-decoration: none;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .register-btn:hover {
      background-color: #f1f5f9;
    }

    /* Centered Login Container */
    .login-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid #f1f5f9;
    }

    .login-card h2 {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .login-card p.subtitle {
      text-align: center;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #334155;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      color: #0f172a;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 8px;
    }

    .submit-btn:hover {
      background-color: #0369a1;
    }

    .submit-btn:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .footer-text {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: #64748b;
    }

    .footer-text a {
      color: #0284c7;
      text-decoration: none;
      font-weight: 500;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }

    .error-msg {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar">
    <a href="/" class="brand">+ JeevanSetu <span>AI Grid</span></a>
    <a href="./register.html" class="register-btn">Register</a>
  </header>

  <!-- Login Form Section -->
  <main class="login-wrapper">
    <div class="login-card">
      <h2>Sign In to JeevanSetu</h2>
      <p class="subtitle">Access your health profile or response console</p>

      <div id="errorBox" class="error-msg"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="name@example.com" 
            required 
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          />
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">Sign In</button>
      </form>

      <p class="footer-text">
        Don't have an account? <a href="./register.html">Register here</a>
      </p>
    </div>
  </main>

  <!-- Login Handling Script -->
  <script>
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorBox = document.getElementById('errorBox');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // UI state reset
      errorBox.style.display = 'none';
      errorBox.innerText = '';
      submitBtn.disabled = true;
      submitBtn.innerText = 'Signing in...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        // Backend login endpoint call
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok && data.user) {
          // User session save in localStorage
          localStorage.setItem('currentUser', JSON.stringify(data.user));

          // Role-based path redirection (relative to current host)
          const role = data.user.role;
          if (role === 'hospital' || role === 'admin') {
            window.location.href = './hospital-dashboard.html';
          } else if (role === 'ambulance') {
            window.location.href = './ambulance.html';
          } else {
            window.location.href = './index.html';
          }
        } else {
          // Authentication error display
          errorBox.innerText = data.message || 'Invalid email or password.';
          errorBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerText = 'Sign In';
        }
      } catch (err) {
        console.error('Login error:', err);
        errorBox.innerText = 'Unable to connect to the server. Please try again.';
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = 'Sign In';
      }
    });
  </script>
</body>
</html>
