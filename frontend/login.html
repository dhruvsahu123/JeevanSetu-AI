<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | JeevanSetu AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .auth-wrapper {
      min-height: calc(100vh - 4.5rem);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
      background: var(--bg-body);
    }
    .auth-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-md);
    }
    .auth-header { text-align: center; margin-bottom: 2rem; }
    .auth-header h2 { font-size: 1.6rem; font-weight: 800; }
    .auth-header p { color: var(--text-muted); font-size: 0.9rem; margin-top: 0.3rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; }
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
    }
    .form-group input:focus { border-color: var(--primary); }
    .auth-footer { text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-muted); }
    .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="navbar container">
      <a href="index.html" class="logo">
        <span class="logo-mark">+</span>
        <span class="logo-text">Jeevan<strong>Setu</strong><span class="ai-badge">AI Grid</span></span>
      </a>
      <div><a href="register.html" class="btn btn-secondary btn-sm">Register</a></div>
    </nav>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Sign In to JeevanSetu</h2>
        <p>Access your health profile or response console</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="name@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">Sign In</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Register here</a>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = "https://jeevansetu-ai-7e5y.onrender.com/api";
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('user', JSON.stringify(data.user));
          const role = data.user.role;
          if (role === 'HOSPITAL') {
            window.location.href = 'hospital-dashboard.html';
          } else if (role === 'AMBULANCE') {
            window.location.href = 'ambulance-tracking.html';
          } else {
            window.location.href = 'customer-dashboard.html';
          }
        } else {
          alert(data.error || 'Invalid credentials');
        }
      } catch (err) {
        alert('Server unreachable. Ensure "python app.py" is running.');
      }
    });
  </script>
</body>
</html>
