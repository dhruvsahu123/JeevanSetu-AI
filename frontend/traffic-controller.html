<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JeevanSetu AI | AI Dynamic Green Wave Traffic Preemption</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07111F;
      --card: #0D1B2A;
      --border: #1E354F;
      --teal: #14B8A6;
      --sky: #38BDF8;
      --danger: #EF4444;
      --yellow: #F59E0B;
      --green: #22C55E;
      --text: #F8FAFC;
      --muted: #94A3B8;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; padding: 2rem 1.5rem; min-height: 100vh; }
    .wrapper { max-width: 1050px; margin: 0 auto; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1.25rem; margin-bottom: 2rem; }
    .header-bar a { color: var(--sky); text-decoration: none; font-weight: 700; font-size: 0.9rem; }

    .signal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.25rem; }
    .signal-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
    
    .light-indicator { width: 18px; height: 18px; border-radius: 50%; display: inline-block; margin-right: 0.5rem; }
    .light-RED { background: var(--danger); box-shadow: 0 0 10px var(--danger); }
    .light-YELLOW { background: var(--yellow); box-shadow: 0 0 10px var(--yellow); }
    .light-GREEN { background: var(--green); box-shadow: 0 0 12px var(--green); }

    .btn-override { background: var(--teal); color: #07111F; border: none; padding: 0.75rem 1rem; border-radius: 8px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 1rem; font-size: 0.9rem; }
    .btn-override:hover { background: #0d9488; }
    .btn-locked { background: #1E354F; color: var(--teal); border: 1px solid var(--teal); cursor: default; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header-bar">
      <div>
        <h2 style="font-size: 1.6rem;">🚦 Dynamic Green Wave Traffic Preemption Controller</h2>
        <p style="color: var(--muted); font-size: 0.85rem;">Kanpur Smart Traffic Management integration for Golden Hour priority transit</p>
      </div>
      <a href="../index.html">← Citizen Portal</a>
    </div>

    <div class="signal-grid" id="signalGrid"></div>
  </div>

  <script>
    function loadSignals() {
      fetch('/api/traffic/signals')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          var grid = document.getElementById('signalGrid');
          grid.innerHTML = '';
          var list = data.intersections || [];

          for (var i = 0; i < list.length; i++) {
            var item = list[i];
            var card = document.createElement('div');
            card.className = 'signal-card';

            var btnHtml = item.preempted
              ? '<button class="btn-override btn-locked">✓ WAVE PREEMPTED (GREEN HELD 120S)</button>'
              : '<button class="btn-override" onclick="triggerOverride('' + item.id + '')">⚡ FORCE GREEN WAVE OVERRIDE</button>';

            card.innerHTML = [
              '<div>',
                '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem;">',
                  '<span style="font-family:monospace; color:var(--sky); font-weight:700;">' + item.id + '</span>',
                  '<div style="display:flex; align-items:center;">',
                    '<span class="light-indicator light-' + item.light + '"></span>',
                    '<strong style="font-size:0.85rem;">' + item.light + '</strong>',
                  '</div>',
                '</div>',
                '<h3 style="font-size:1.15rem; margin-bottom:0.4rem;">' + item.name + '</h3>',
                '<p style="color:var(--muted); font-size:0.8rem; font-family:monospace;">GPS: ' + item.lat + '° N, ' + item.lng + '° E</p>',
              '</div>',
              btnHtml
            ].join('');

            grid.appendChild(card);
          }
        });
    }

    function triggerOverride(id) {
      fetch('/api/traffic/override/' + id, { method: 'POST' })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          alert('🟢 TRAFFIC OVERRIDE: ' + data.clearance_advisory);
          loadSignals();
        });
    }

    document.addEventListener('DOMContentLoaded', loadSignals);
  </script>
</body>
</html>
