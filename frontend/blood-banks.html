<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JeevanSetu AI | Kanpur Blood Bank & Component Grid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07111F;
      --card: #0D1B2A;
      --border: #1E354F;
      --teal: #14B8A6;
      --sky: #38BDF8;
      --danger: #EF4444;
      --text: #F8FAFC;
      --muted: #94A3B8;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; padding: 2rem 1.5rem; min-height: 100vh; }
    .wrapper { max-width: 1100px; margin: 0 auto; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1.25rem; margin-bottom: 2rem; }
    .header-bar a { color: var(--sky); text-decoration: none; font-weight: 700; font-size: 0.9rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
    .bb-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between; }
    .unit-tag { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; padding: 0.35rem 0.6rem; border-radius: 6px; background: #07111F; border: 1px solid var(--border); display: flex; justify-content: space-between; margin-bottom: 0.4rem; }
    .crit { color: var(--danger); font-weight: 700; }
    .safe { color: var(--teal); font-weight: 700; }
    .btn-dispatch { background: var(--danger); color: #fff; border: none; padding: 0.75rem; border-radius: 8px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 1rem; transition: 0.2s; }
    .btn-dispatch:hover { background: #dc2626; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header-bar">
      <div>
        <h2 style="font-size: 1.6rem;">🩸 Kanpur Emergency Blood & Component Hub</h2>
        <p style="color: var(--muted); font-size: 0.85rem;">Live component reserves & emergency transfusion dispatch</p>
      </div>
      <a href="../index.html">← Back to Home</a>
    </div>

    <div class="grid" id="bbGrid"></div>
  </div>

  <script>
    function loadBloodBanks() {
      fetch('/api/blood_banks')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          var list = data.blood_banks || [];
          var grid = document.getElementById('bbGrid');
          grid.innerHTML = '';

          for (var i = 0; i < list.length; i++) {
            var b = list[i];
            var card = document.createElement('div');
            card.className = 'bb-card';

            card.innerHTML = [
              '<div>',
                '<h4 style="font-size:1.15rem; margin-bottom:0.25rem;">' + b.facility_name + '</h4>',
                '<p style="color:var(--muted); font-size:0.85rem; margin-bottom:1rem;">📍 ' + b.locality + '</p>',
                '<div style="display:flex; flex-direction:column; gap:0.2rem;">',
                  '<div class="unit-tag"><span>O Negative (Universal Donor)</span><span class="' + (b.units_o_negative < 5 ? 'crit' : 'safe') + '">' + b.units_o_negative + ' Units</span></div>',
                  '<div class="unit-tag"><span>AB Negative</span><span class="safe">' + b.units_ab_negative + ' Units</span></div>',
                  '<div class="unit-tag"><span>B Negative</span><span class="safe">' + b.units_b_negative + ' Units</span></div>',
                  '<div class="unit-tag"><span>O Positive</span><span class="safe">' + b.units_o_positive + ' Units</span></div>',
                  '<div class="unit-tag"><span>B Positive</span><span class="safe">' + b.units_b_positive + ' Units</span></div>',
                '</div>',
              '</div>',
              '<div>',
                '<button class="btn-dispatch" onclick="alert('Emergency Blood Requisition flagged to ' + b.facility_name + ' desk via priority hotline.')">🚨 Disptach Emergency Units</button>',
                '<p style="text-align:center; font-size:0.8rem; color:var(--sky); margin-top:0.5rem;">Desk: ' + b.contact_phone + '</p>',
              '</div>'
            ].join('');

            grid.appendChild(card);
          }
        })
        .catch(function(err) { console.error(err); });
    }

    document.addEventListener('DOMContentLoaded', loadBloodBanks);
  </script>
</body>
</html>
