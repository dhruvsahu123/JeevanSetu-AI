<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JeevanSetu AI | Emergency Command Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07111F;
      --card: #0D1B2A;
      --border: #1E354F;
      --teal: #14B8A6;
      --sky: #38BDF8;
      --red: #EF4444;
      --yellow: #F59E0B;
      --text: #F8FAFC;
      --muted: #94A3B8;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; padding: 2rem 1.5rem; min-height: 100vh; }
    .wrapper { max-width: 1100px; margin: 0 auto; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1.25rem; margin-bottom: 2rem; }
    .header-bar a { color: var(--sky); text-decoration: none; font-weight: 700; font-size: 0.9rem; }
    
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
    .kpi-label { font-size: 0.8rem; color: var(--muted); font-weight: 700; text-transform: uppercase; }
    .kpi-val { font-size: 2rem; font-weight: 800; font-family: 'JetBrains Mono', monospace; color: var(--teal); margin-top: 0.35rem; }

    .chart-panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .bar-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; font-size: 0.9rem; }
    .bar-track { flex: 1; height: 10px; background: #07111F; border-radius: 5px; margin: 0 1rem; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header-bar">
      <div>
        <h2 style="font-size: 1.6rem;">📊 Kanpur Trauma Analytics & Command KPI</h2>
        <p style="color: var(--muted); font-size: 0.85rem;">Network-wide telemetry, saturation rates & Golden Hour compliance</p>
      </div>
      <a href="../index.html">← Citizen Portal</a>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card">
        <span class="kpi-label">GOLDEN HOUR SUCCESS</span>
        <div class="kpi-val" id="kpiGolden">94.2%</div>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">TOTAL EMERGENCIES</span>
        <div class="kpi-val" id="kpiSos" style="color:var(--sky);">--</div>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">ICU OCCUPANCY INDEX</span>
        <div class="kpi-val" id="kpiIcu" style="color:var(--red);">--%</div>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">BLOOD GRID RESERVES</span>
        <div class="kpi-val" id="kpiBlood" style="color:var(--yellow);">-- u</div>
      </div>
    </div>

    <div class="chart-panel">
      <h3 style="font-size:1.1rem; margin-bottom:1.25rem;">🚨 NH-19 Corridor High-Risk Casualty Hotspots</h3>
      <div id="hotspotList"></div>
    </div>
  </div>

  <script>
    function loadAnalytics() {
      fetch('/api/analytics/summary')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          document.getElementById('kpiGolden').textContent = data.golden_hour_rate;
          document.getElementById('kpiSos').textContent = data.total_sos_dispatched;
          document.getElementById('kpiIcu').textContent = data.icu_occupancy_pct + '%';
          document.getElementById('kpiBlood').textContent = data.blood_reserve_units + ' u';

          var hotspots = data.corridor_hotspots || [];
          var container = document.getElementById('hotspotList');
          container.innerHTML = '';

          for (var i = 0; i < hotspots.length; i++) {
            var h = hotspots[i];
            var pct = Math.min(100, h.incidents * 8);
            var color = (h.status === 'CRITICAL') ? '#EF4444' : '#38BDF8';

            var row = document.createElement('div');
            row.className = 'bar-row';
            row.innerHTML = [
              '<span style="width:180px; font-weight:700;">' + h.zone + '</span>',
              '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%; background:' + color + ';"></div></div>',
              '<span style="font-family:monospace; font-weight:700; width:110px; text-align:right;">' + h.incidents + ' Dispatches</span>'
            ].join('');

            container.appendChild(row);
          }
        })
        .catch(function(err) { console.error(err); });
    }

    loadAnalytics();
    setInterval(loadAnalytics, 5000);
  </script>
</body>
</html>
